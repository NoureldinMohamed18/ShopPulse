name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests with coverage
        run: pytest --cov=shoppulse --cov-report=term-missing --cov-fail-under=80
      - name: End-to-end smoke test (offline pipeline)
        env:
          SHOPPULSE_DATA_DIR: ${{ runner.temp }}/shoppulse
        run: |
          pip install -e .
          python -m shoppulse demo
          python -m shoppulse status

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shoppulse:ci .
      - name: Smoke-test the container (pipeline, then API)
        run: |
          docker run --rm -v shoppulse_ci:/data shoppulse:ci python -m shoppulse demo
          docker run -d --name api -p 5000:5000 -v shoppulse_ci:/data shoppulse:ci
          for i in $(seq 1 15); do curl -sf localhost:5000/health && break || sleep 2; done
          curl -sf localhost:5000/api/kpis
          docker rm -f api
